
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple online note-taking app</p>
    </header>

    <main>
        <section>
            <button id="load-btn" type="button">Load notes</button>
            <p id="status" role="status" aria-live="polite">
                Click "Load notes" to get started.
            </p>
        </section>

        <section>
            <h2>Create a note</h2>

            <form id="note-form">
                <label for="title-input">Note title</label>
                <input
                    type="text"
                    id="title-input"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note content</label>
                <textarea id="body-input" rows="5"></textarea>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>

        <section>
            <h2>Your notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
